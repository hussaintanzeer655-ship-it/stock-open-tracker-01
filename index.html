<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Open Clock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>Market Open Clock</h1>
    <p class="lead">US stock market opens at 9:30 AM ET on trading days.</p>
    <div class="panel">
      <div class="row"><span>Next Open:</span><strong id="next-open">--</strong></div>
      <div class="row"><span>Countdown:</span><strong id="countdown">--</strong></div>
      <div class="row"><span>Status:</span><strong id="status">Loading...</strong></div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
